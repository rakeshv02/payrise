<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pay Rise Calculator — Salary Increase Impact | Tabutility</title>
  <meta name="description" content="Calculate the exact impact of a pay rise on your salary. See how much extra you earn per year, month and week after a percentage or fixed increase." />
  <meta name="keywords" content="pay rise calculator, salary increase calculator, raise calculator, pay increase, how much is my raise worth" />
  <link rel="canonical" href="https://payrise.tabutility.com/" />
  <meta property="og:title" content="Pay Rise Calculator" />
  <meta property="og:description" content="See exactly how much extra a pay rise is worth per year, month and week." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
  <meta name="robots" content="index, follow" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7039091592734005" crossorigin="anonymous"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-78VZWJ5B1W"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-78VZWJ5B1W');</script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;background:#f8faff;font-family:'Segoe UI',Arial,sans-serif">
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState } = React;
function fmt(n,d=0){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}

function App() {
  const [current, setCurrent] = useState(55000);
  const [mode, setMode] = useState('pct');
  const [pct, setPct] = useState(5);
  const [fixed, setFixed] = useState(3000);
  const [inflation, setInflation] = useState(2.9);

  const cur = Number(current)||0;
  const increase = mode === 'pct' ? cur * Number(pct) / 100 : Number(fixed)||0;
  const newSalary = cur + increase;
  const pctIncrease = cur > 0 ? (increase / cur * 100) : 0;
  const realIncrease = pctIncrease - Number(inflation);

  return (
    <div style={{maxWidth:520,margin:'0 auto',paddingBottom:40}}>
      <div style={{background:'#1a1a2e',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <a href="https://tabutility.com" style={{color:'#a5b4fc',textDecoration:'none',fontSize:14}}>← All Tools</a>
        <span style={{color:'#fff',fontWeight:700,fontSize:15}}>⚡ Tabutility</span>
      </div>
      <div style={{background:'linear-gradient(135deg,#16a34a,#166534)',padding:'28px 20px',textAlign:'center',color:'#fff'}}>
        <div style={{fontSize:36,marginBottom:8}}>🚀</div>
        <h1 style={{margin:'0 0 6px',fontSize:22,fontWeight:900}}>Pay Rise Calculator</h1>
        <p style={{margin:0,fontSize:13,opacity:0.85}}>See exactly what your raise is worth</p>
      </div>
      <div style={{padding:20}}>
        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginBottom:16}}>
          <div style={{marginBottom:14}}>
            <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Current Annual Salary</label>
            <div style={{position:'relative'}}>
              <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#6b7280'}}>$</span>
              <input type="number" value={current} onChange={e=>setCurrent(e.target.value)}
                style={{width:'100%',padding:'11px 12px 11px 28px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box'}} />
            </div>
          </div>
          <div style={{display:'flex',gap:8,marginBottom:14}}>
            {[['pct','% Increase'],['fixed','Fixed Amount']].map(([m,l])=>(
              <button key={m} onClick={()=>setMode(m)} style={{flex:1,padding:'9px',borderRadius:10,border:`2px solid ${mode===m?'#16a34a':'#e5e7eb'}`,background:mode===m?'#16a34a':'#fff',color:mode===m?'#fff':'#374151',fontWeight:600,cursor:'pointer',fontSize:13}}>{l}</button>
            ))}
          </div>
          {mode === 'pct' ? (
            <div>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Pay Increase: <span style={{color:'#16a34a'}}>{pct}%</span></label>
              <input type="range" min={0} max={50} step={0.5} value={pct} onChange={e=>setPct(e.target.value)} style={{width:'100%',accentColor:'#16a34a'}} />
              <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'#9ca3af',marginTop:4}}>
                <span>0%</span><span>25%</span><span>50%</span>
              </div>
            </div>
          ) : (
            <div>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Fixed Increase Amount</label>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#6b7280'}}>$</span>
                <input type="number" value={fixed} onChange={e=>setFixed(e.target.value)}
                  style={{width:'100%',padding:'11px 12px 11px 28px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box'}} />
              </div>
            </div>
          )}
          <div style={{marginTop:14}}>
            <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Inflation Rate: <span style={{color:'#6b7280'}}>{inflation}%</span></label>
            <input type="range" min={0} max={15} step={0.1} value={inflation} onChange={e=>setInflation(e.target.value)} style={{width:'100%',accentColor:'#6b7280'}} />
          </div>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
          <div style={{background:'#f0fdf4',borderRadius:14,padding:16,textAlign:'center'}}>
            <div style={{fontSize:12,fontWeight:700,color:'#166534'}}>NEW SALARY</div>
            <div style={{fontSize:28,fontWeight:900,color:'#16a34a',margin:'4px 0'}}>{fmt(newSalary)}</div>
          </div>
          <div style={{background:'#eff6ff',borderRadius:14,padding:16,textAlign:'center'}}>
            <div style={{fontSize:12,fontWeight:700,color:'#1e40af'}}>INCREASE</div>
            <div style={{fontSize:28,fontWeight:900,color:'#3b82f6',margin:'4px 0'}}>+{fmt(increase)}</div>
          </div>
        </div>

        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)'}}>
          {[
            ['Current Salary', fmt(cur)],
            ['Pay Increase', '+'+fmt(increase)+' ('+pctIncrease.toFixed(1)+'%)'],
            ['New Annual Salary', fmt(newSalary)],
            ['Extra per Month', '+'+fmt(increase/12)],
            ['Extra per Week', '+'+fmt(increase/52)],
            ['Extra per Day (5-day week)', '+'+fmt(increase/260)],
            ['Inflation Adjustment', inflation+'%'],
            ['Real Pay Rise', (realIncrease>=0?'+':'')+realIncrease.toFixed(1)+'%'],
          ].map(([l,v])=>(
            <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid #f0f0f0',fontSize:14}}>
              <span style={{color:'#6b7280'}}>{l}</span><strong style={{color:l.includes('Real')&&realIncrease<0?'#dc2626':l.includes('Real')&&realIncrease>0?'#16a34a':'#1a1a2e'}}>{v}</strong>
            </div>
          ))}
        </div>
        <div style={{background:'#f0fdf4',borderRadius:12,padding:16,marginTop:16,fontSize:13,color:'#166534',lineHeight:1.6}}>
          <strong>Real pay rise</strong> = your raise % minus inflation. If inflation is 4% and you get a 3% raise, your real purchasing power actually falls by 1%.
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
//]]>
</script>
</body>
</html>
